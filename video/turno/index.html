<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<title>Turno · resumo</title>
<script src="vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: "InterB"; src: url("assets/Inter-Bold.ttf"); }
  body { margin: 0; background: #1b1c28; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1b1c28; font-family: "InterB"; color: #f6e6d2; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .full { position: absolute; left: 0; top: 0; display: block; width: 1280px; height: 720px; }
  .shade { position: absolute; inset: 0; background: #14151fd9; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .logo { display: block; width: 190px; height: 190px; }
  h1 { margin: 0; font-size: 130px; letter-spacing: -.04em; line-height: 1; }
  .beta { padding: 8px 30px; border-radius: 12px; background: #f0b48a; color: #1b1c28; font-size: 34px; letter-spacing: .12em; }
  p { margin: 0; font-size: 38px; }
  .caption { position: absolute; left: 40px; bottom: 40px; padding: 18px 28px; border: 3px solid #f0b48a; border-radius: 14px; background: #1b1c28f2; font-size: 38px; }
</style>
</head>
<body>
<div id="root" data-composition-id="turno" data-start="0" data-width="1280" data-height="720" data-duration="10">
  <section class="scene clip" id="intro" data-start="0" data-duration="2.4" data-track-index="0">
    <img class="full" id="bg" src="assets/office.jpg" alt="" data-layout-allow-overflow>
    <div class="shade"></div>
    <div class="center" id="brand"><img class="logo" id="logo" src="assets/logo.svg" alt=""><h1>Turno</h1><span class="beta" id="beta">EM BETA</span></div>
  </section>
  <section class="scene clip" id="map" data-start="2.4" data-duration="2.8" data-track-index="0">
    <img class="full" id="office" src="assets/office.jpg" alt="" data-layout-allow-overflow>
    <div class="caption" id="c1">Um escritório para os seus agentes</div>
  </section>
  <section class="scene clip" id="desks" data-start="5.2" data-duration="2.8" data-track-index="0">
    <img class="full" id="zoom" src="assets/zoom.jpg" alt="" data-layout-allow-overflow>
    <div class="caption" id="c2">Cada mesa abre a sua conversa</div>
  </section>
  <section class="scene clip" id="end" data-start="8" data-duration="2" data-track-index="0">
    <div class="center" id="final"><img class="logo" src="assets/logo.svg" alt=""><h1>Turno</h1><p>Agentes locais em pixel art</p><span class="beta">EM BETA</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#bg", { scale: 1.25 }, { scale: 1.05, duration: 2.4, ease: "none" }, 0);
  tl.fromTo("#brand h1", { y: 50, scale: .85 }, { y: 0, scale: 1, duration: .6, ease: "back.out(1.6)" }, 0);
  tl.fromTo("#logo", { y: -90, rotation: -18 }, { y: 0, rotation: 0, duration: .65, ease: "back.out(2)" }, 0);
  tl.fromTo("#beta", { scale: 0, rotation: -14 }, { scale: 1, rotation: -4, duration: .5, ease: "back.out(2.2)" }, .6);
  tl.fromTo("#office", { scale: .82, y: 60 }, { scale: 1.04, y: 0, duration: 2.8, ease: "power2.out" }, 2.4);
  tl.fromTo("#c1", { x: -700, opacity: 0 }, { x: 0, opacity: 1, duration: .5, ease: "power3.out" }, 2.7);
  tl.fromTo("#zoom", { scale: 1.18, x: 90 }, { scale: 1, x: -20, duration: 2.8, ease: "power1.inOut" }, 5.2);
  tl.fromTo("#c2", { x: -700, opacity: 0 }, { x: 0, opacity: 1, duration: .5, ease: "power3.out" }, 5.45);
  tl.fromTo("#final", { scale: .85, opacity: 0 }, { scale: 1, opacity: 1, duration: .55, ease: "back.out(1.5)" }, 8.05);
  window.__timelines = window.__timelines || {};
  window.__timelines["turno"] = tl;
</script>
</body>
</html>
